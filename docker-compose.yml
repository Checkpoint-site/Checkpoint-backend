services:
    sqlserver_database:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: sqlserver_database
        restart: unless-stopped
        environment:
            MSSQL_SA_PASSWORD: ${SENHA_DATABASE}
            ACCEPT_EULA: "Y"
        ports:
            - "1433:1433"
        volumes:
            - sqlserver_data:/var/opt/mssql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
volumes:
    sqlserver_data:
